<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripU</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#101714;--card:#19231f;--text:#edf5f0;--muted:#9aaca2;--line:#304139;--mint:#43d9a3} [data-theme=light]{--bg:#f3f7f5;--card:#fff;--text:#17251e;--muted:#64766c;--line:#dce7e0;--mint:#159b70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}.wrap{max-width:720px;margin:auto;padding:20px 14px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:27px;font-weight:850}.brand b{color:var(--mint)}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;margin:14px 0}h1{font-size:22px}h2{font-size:17px;margin:0 0 12px}.muted,label{color:var(--muted);font-size:13px}input{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);width:100%;margin:5px 0 12px}button{border:0;border-radius:11px;padding:10px 13px;background:#26372f;color:var(--text);font-weight:650;cursor:pointer}button.primary,.active{background:var(--mint);color:#08251a}.ghost{background:transparent;border:1px solid var(--line)}.person{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);padding:12px 0}.person:first-of-type{border:0}.grow{flex:1}.name{font-weight:700}.small{font-size:12px;color:var(--muted)}.trip{padding:9px;min-width:58px}.total{font-size:30px;font-weight:850}.hidden{display:none!important}.notice{background:#26372f;padding:10px;border-radius:10px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body><div class="wrap"><header class="top"><div class="brand">Trip<b>U</b></div><div><button class="ghost" id="theme">☼</button> <button class="ghost hidden" id="logout">Salir</button></div></header>
<section id="auth" class="card"><h1>Tu cuenta TripU</h1><label>Correo electrónico</label><input id="email" type="email"><label>Contraseña</label><input id="password" type="password"><div class="row"><button class="primary" id="login">Iniciar sesión</button><button id="signup">Crear cuenta</button></div><p id="authmsg" class="notice">Configura las claves de Supabase en el archivo, tal como indica README.md.</p></section>
<main id="app" class="hidden"><div class="row"><div><h1>Registro de viajes</h1><div class="muted">Marca quién hace cada trayecto.</div></div><input style="max-width:175px" id="date" type="date"></div>
<section class="card"><div class="row"><h2>Pasajeros</h2><button id="manage">Editar lista</button></div><div id="people"></div><p id="empty" class="notice hidden">Añade pasajeros desde «Editar lista».</p></section>
<section class="card row"><div><div class="muted">Total a cobrar hoy</div><div id="total" class="total">0,00 €</div></div><div><div class="muted">Trayectos</div><b id="count">0</b></div></section>
<section id="settings" class="card hidden"><div class="row"><h2>Personalizar pasajeros</h2><button id="close">Cerrar</button></div><label>Nombre</label><input id="newname" placeholder="Nombre"><div class="grid"><div><label>Precio por trayecto (€)</label><input id="fare" type="number" min="0" step=".01" value="2.50"></div><div class="row"><label><input id="pays" type="checkbox" checked style="width:auto"> Paga</label></div></div><button class="primary" id="add">Añadir pasajero</button><div id="manageList"></div></section></main><p id="msg" class="notice hidden"></p></div>
<script>
const URL='https://rkqernwonfoxrrteyisa.supabase.co',KEY='sb_publishable_xY53Hvr1T0rpqpHMblohpw_DVZZiAV7';const $=x=>document.getElementById(x);let sb,user,people=[],entries=[];
const configured=URL.startsWith('https://')&&!URL.includes('PEGA_AQUI')&&!KEY.includes('PEGA_AQUI');
const localDate=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
$('date').value=localDate(new Date());const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0);
function notice(id,t){$(id).textContent=t;$(id).classList.remove('hidden')}
function authView(){ $('auth').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}
function appView(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden')}
async function load(){let r=await sb.from('participants').select('*').eq('archived',false).order('created_at');if(r.error)throw r.error;people=r.data; r=await sb.from('trip_entries').select('*').eq('trip_date',$('date').value);if(r.error)throw r.error;entries=r.data;render()}
function render(){ $('people').innerHTML='';$('empty').classList.toggle('hidden',people.length>0);people.forEach(p=>{let e=entries.find(x=>x.participant_id===p.id),d=document.createElement('div');d.className='person';let info=document.createElement('div');info.className='grow';info.innerHTML='<div class="name"></div><div class="small"></div>';info.children[0].textContent=p.name;info.children[1].textContent=p.pays?'Paga · '+eur(p.fare_per_trip)+' por trayecto':'No paga';d.append(info);['ida','vuelta'].forEach(dir=>{let b=document.createElement('button');b.className='trip '+(e&&(e.direction===dir||e.direction==='ida_vuelta')?'active':'');b.textContent=dir==='ida'?'Ida':'Vuelta';b.onclick=()=>toggle(p,dir);d.append(b)});$('people').append(d)});
let count=0,total=0;entries.forEach(e=>{let n=e.direction==='ida_vuelta'?2:1;count+=n;total+=n*Number(e.fare_applied)});$('total').textContent=eur(total);$('count').textContent=count;renderManage()}
async function toggle(p,dir){try{let e=entries.find(x=>x.participant_id===p.id),next=!e?dir:e.direction===dir?null:e.direction==='ida_vuelta'?(dir==='ida'?'vuelta':'ida'):'ida_vuelta';let r;if(e&&next===null)r=await sb.from('trip_entries').delete().eq('id',e.id);else if(e)r=await sb.from('trip_entries').update({direction:next}).eq('id',e.id);else r=await sb.from('trip_entries').insert({participant_id:p.id,trip_date:$('date').value,direction:next,fare_applied:p.pays?Number(p.fare_per_trip):0});if(r.error)throw r.error;await load()}catch(e){notice('msg',e.message)}}
function renderManage(){$('manageList').innerHTML='';people.forEach(p=>{let d=document.createElement('div');d.className='person';let t=document.createElement('span');t.className='grow';t.textContent=p.name+' · '+(p.pays?'Paga':'No paga')+' · '+eur(p.fare_per_trip);let edit=document.createElement('button');edit.textContent='Editar';edit.onclick=async()=>{let n=prompt('Nombre',p.name);if(n===null)return;let f=prompt('Precio por trayecto',p.fare_per_trip);if(f===null)return;let pays=confirm('¿Paga? Aceptar = sí, Cancelar = no');let r=await sb.from('participants').update({name:n.trim(),fare_per_trip:Math.max(0,+f||0),pays}).eq('id',p.id);if(r.error)notice('msg',r.error.message);else load()};let del=document.createElement('button');del.textContent='Quitar';del.onclick=async()=>{if(confirm('¿Quitar pasajero? Se conserva su historial.')){let r=await sb.from('participants').update({archived:true}).eq('id',p.id);if(r.error)notice('msg',r.error.message);else load()}};d.append(t,edit,del);$('manageList').append(d)})}
async function start(){if(!configured){authView();return}sb=window.supabase.createClient(URL,KEY);let {data:{session}}=await sb.auth.getSession();if(session){user=session.user;appView();await load()}else authView();sb.auth.onAuthStateChange(async(_,s)=>{if(s){user=s.user;appView();try{await load()}catch(e){notice('msg',e.message)}}else authView()})}
$('login').onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)notice('authmsg',error.message)};
$('signup').onclick=async()=>{let {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});notice('authmsg',error?error.message:'Cuenta creada. Confirma tu correo si Supabase lo solicita.')};
$('logout').onclick=()=>sb.auth.signOut();$('date').onchange=()=>load().catch(e=>notice('msg',e.message));$('manage').onclick=()=>$('settings').classList.remove('hidden');$('close').onclick=()=>$('settings').classList.add('hidden');
$('add').onclick=async()=>{let name=$('newname').value.trim();if(!name)return alert('Escribe un nombre');let r=await sb.from('participants').insert({name,pays:$('pays').checked,fare_per_trip:Math.max(0,+$('fare').value||0)});if(r.error)notice('msg',r.error.message);else{$('newname').value='';await load()}};
$('theme').onclick=()=>{let light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';localStorage.setItem('tripu-theme',light?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem('tripu-theme')||'dark';start();
</script></body></html>
